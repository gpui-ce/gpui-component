[workspace]
default-members = ["crates/story"]
members = [
    "crates/kit",
    "crates/base",
    "crates/base/examples/wasm",
    "crates/base/examples/native",
    "crates/component-macros",
    "crates/story",
    "crates/story-web",
    "crates/component",
    "crates/assets",
    "crates/fps",
    "crates/webview",
    "examples/app_assets",
    "examples/fps_monitor",
    "examples/hello_world",
    "examples/input",
    "examples/editor",
    "examples/brush",
    "examples/dock",
    "examples/html",
    "examples/large-text",
    "examples/markdown",
    "examples/stream-markdown",
    "examples/window_title",
    "examples/dialog_overlay",
    "examples/webview",
    "examples/system_monitor",
    "examples/focus_trap",
    "examples/tooltip_top_edge",
    "examples/sidebar",
    "examples/text_max_lines",
    "examples/text_selection",
    "examples/table_in_scrollable",
    "examples/markdown_table",
    "examples/ai_recipes",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
publish = false
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/gpui-ce/gpui-component"
homepage = "https://gpui-ce.github.io/"

[workspace.dependencies]
gpui-kit = { package = "gpui_ce_kit", path = "crates/kit", version = "0.2.0", default-features = false }
gpui-component = { package = "gpui_ce_components", path = "crates/component", version = "0.2.0" }
gpui-base = { package = "gpui_ce_components_base", path = "crates/base", version = "0.2.0" }
gpui-component-macros = { package = "gpui_ce_components_macros", path = "crates/component-macros", version = "0.2.0" }
gpui-kit-assets = { package = "gpui_ce_components_assets", path = "crates/assets", version = "0.2.0" }
gpui-fps = { package = "gpui_ce_components_fps", path = "crates/fps", version = "0.2.0" }
gpui-wry = { package = "gpui_ce_components_webview", path = "crates/webview", version = "0.2.0" }
story = { path = "crates/story" }

# GPUI CE is published to crates.io as `gpui-ce` with its platform, web and
# macros split into sibling crates.
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", features = [
  "font-kit",
  "x11",
  "wayland",
] }
gpui_web = { package = "gpui_ce_web", version = "=0.3.0" }
gpui_macros = { package = "gpui_ce_macros", version = "=0.3.0" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
reqwest = { version = "0.12.15-zed", package = "zed-reqwest", default-features = false, features = [
  "charset",
  "http2",
  "macos-system-configuration",
  "multipart",
  "rustls-tls-native-roots",
  "socks",
  "stream",
] }

anyhow = "1"
web-time = "1"
log = "0.4"
futures = "0.3"
http = "1"
palette = "0.7.6"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
  "metric_chars",
  "metric_lines_lf",
  "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "regex-fancy",
] }
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-ce = { opt-level = 3 }
gpui_ce_platform = { opt-level = 3 }
gpui_ce_macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]
