[package]
name = "gpui-base-examples"
default-run = "components"
version = "0.7.0"
publish = false
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono = "0.4.38"
gpui.workspace = true
gpui-base = { workspace = true }
gpui_platform.workspace = true
futures.workspace = true
http = "1"
log.workspace = true
reqwest.workspace = true
syntect.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Shared showcase and HTTP modules are included with `#[path]`, which
# cargo-machete cannot follow when detecting these imports.
[package.metadata.cargo-machete]
ignored = ["chrono", "futures", "reqwest", "syntect"]
